<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaahanCheck — Vehicle RC Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root{
    --bg:#050505;
    --ink:#FFFFFF;
    --ink-soft:#A8A8A8;
    --ink-faint:rgba(255,255,255,0.38);
    --paper:#050505;
    --paper-line:rgba(255,255,255,0.08);
    --card:rgba(255,255,255,0.035);
    --card-solid:#0b0f0b;
    --plate-yellow:#00FF66;
    --plate-yellow-dark:#00CC52;
    --steel-blue:#00E676;
    --steel-blue-dark:#00B85F;
    --hwy-green:#00FF66;
    --hwy-green-bg:rgba(0,255,102,0.1);
    --alert-red:#FF5C5C;
    --alert-red-bg:rgba(255,92,92,0.12);
    --radius:16px;
    --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    --glow:0 0 30px rgba(0,255,102,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Rajdhani',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 12% -5%, rgba(0,255,102,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 95% 10%, rgba(0,230,118,0.1), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 70% 55% at 50% 0%, #000 40%, transparent 100%);
    pointer-events:none;
    z-index:0;
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px clamp(20px,5vw,56px);
    background:rgba(5,5,5,0.75);
    backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid var(--paper-line);
    position:relative;z-index:2;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(140deg,var(--plate-yellow),var(--steel-blue-dark));
    display:flex;align-items:center;justify-content:center;
    color:#012b12;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
    box-shadow:0 0 18px rgba(0,255,102,0.35);
  }
  .brand-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.02em;color:#fff;}
  .brand-tag{font-size:11px;color:var(--ink-soft);letter-spacing:0.14em;text-transform:uppercase;margin-top:1px;}

  .hero{
    position:relative;
    z-index:1;
    padding:64px clamp(20px,5vw,56px) 76px;
    overflow:hidden;
  }
  .hero-inner{position:relative;max-width:760px;margin:0 auto;text-align:center;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:0.2em;text-transform:uppercase;
    color:var(--plate-yellow);font-weight:600;margin-bottom:16px;
    background:rgba(0,255,102,0.08);
    border:1px solid rgba(0,255,102,0.28);
    padding:7px 16px;border-radius:100px;
  }
  .hero h1{
    font-size:clamp(1.9rem,4.6vw,3rem);
    font-weight:700;line-height:1.12;margin:0 0 14px;letter-spacing:0.01em;
    color:#fff;
  }
  .hero p.sub{
    color:var(--ink-soft);font-size:15.5px;line-height:1.6;
    max-width:520px;margin:0 auto 34px;
  }

  .plate-search{
    display:flex;align-items:stretch;
    max-width:540px;margin:0 auto;
    background:rgba(255,255,255,0.045);
    backdrop-filter:blur(16px);
    border:1px solid rgba(0,255,102,0.3);
    border-radius:14px;
    box-shadow:var(--shadow), var(--glow);
    position:relative;
    transition:box-shadow .4s ease, border-color .4s ease;
  }
  .plate-search:focus-within{
    border-color:rgba(0,255,102,0.6);
    box-shadow:var(--shadow), 0 0 44px rgba(0,255,102,0.3);
  }
  .plate-strip{
    width:46px;flex-shrink:0;
    background:linear-gradient(160deg,#0d1410,#050805);
    color:var(--plate-yellow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border-right:1px solid rgba(0,255,102,0.25);
    font-family:'Rajdhani',sans-serif;
  }
  .plate-strip .iso{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-weight:700;font-size:12px;letter-spacing:0.14em;
  }
  .plate-input-wrap{flex:1;position:relative;display:flex;align-items:center;}
  .plate-input{
    width:100%;border:none;outline:none;background:transparent;
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:clamp(1.3rem,4.2vw,1.9rem);
    letter-spacing:0.12em;text-transform:uppercase;
    color:#fff;
    padding:14px 18px;
  }
  .stamp-btn{
    flex-shrink:0;
    background:linear-gradient(100deg,var(--plate-yellow),var(--steel-blue-dark));
    border:none;
    padding:0 20px;
    display:flex;align-items:center;gap:8px;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:0.08em;text-transform:uppercase;
    color:#012b12;cursor:pointer;
    border-radius:0 13px 13px 0;
  }

  .download-btn {
    display: none;
    margin: 24px auto 0;
    background: #fff;
    color: #000;
    border: none;
    padding: 12px 28px;
    border-radius: 50px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    z-index: 10;
    position: relative;
  }
  .download-btn.visible { display: inline-flex; }
  .download-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2); }

  .results-wrap{
    max-width:1040px;margin:0 auto;
    padding:0 clamp(20px,5vw,56px) 80px;
    position:relative;z-index:1;
    text-align: center;
  }
  .results-wrap{margin-top:-40px;}

  .state-panel{
    display:none;
    background:var(--card);
    border:1px solid var(--paper-line);
    backdrop-filter:blur(16px);
    border-radius:var(--radius);
    padding:48px 24px;
    text-align:center;
    margin-top:8px;
  }
  .state-panel.visible{display:block;}
  .spinner{
    width:44px;height:44px;margin:0 auto 18px;
    border-radius:50%;
    border:4px dashed rgba(0,255,102,0.5);
    border-top-color:var(--plate-yellow);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .echo-plate{
    display:none;
    align-items:center;flex-wrap:wrap;gap:14px 22px;
    background:var(--card);border:1px solid var(--paper-line);
    backdrop-filter:blur(16px);
    border-radius:var(--radius);
    padding:18px 24px;margin-top:8px;margin-bottom:22px;
    text-align: left;
  }
  .echo-plate.visible{display:flex;}
  .echo-number{
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:1.5rem;letter-spacing:0.1em;
    background:rgba(0,255,102,0.06);border:1.5px solid rgba(0,255,102,0.4);border-radius:8px;
    padding:6px 14px;color:var(--plate-yellow);
  }
  .echo-meta .name{font-weight:700;font-size:15px;color:#fff;display: block;}
  .echo-meta .sub{font-size:12.5px;color:var(--ink-soft);}

  .cards-grid{
    display:none;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    text-align: left;
  }
  .cards-grid.visible{display:grid;}
  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid var(--paper-line);
    backdrop-filter:blur(16px);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .card-strip{height:3px;width:100%;}
  .strip-owner{background:linear-gradient(90deg,#00FF66,#00E676);}
  .strip-vehicle{background:linear-gradient(90deg,#00E676,#00b85f);}
  .strip-registration{background:linear-gradient(90deg,#00FF66,#00CC52);}
  .strip-insurance{background:linear-gradient(90deg,#00FF66,#00E676);}
  .strip-compliance{background:linear-gradient(90deg,#FF5C5C,#ff8a5c);}

  .card-head{display:flex;align-items:center;gap:12px;padding:18px 22px 14px;}
  .card-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(0,255,102,0.25);
    background:rgba(0,255,102,0.08);color:var(--plate-yellow);
  }
  .card-head h3{margin:0;font-size:18px;font-weight:700;color:#fff;}

  .card-body{padding:2px 22px 18px;}
  .row{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding:9px 0;border-top:1px solid var(--paper-line);
  }
  .row .label{font-size:12.5px;color:var(--ink-soft);padding-top:2px;}
  .row .value{font-size:13.5px;font-weight:600;color:#fff;text-align:right;}
  
  .badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:rgba(0,255,102,0.12);color:var(--plate-yellow);border:1px solid rgba(0,255,102,0.3);
  }

  footer{
    padding:26px clamp(20px,5vw,56px) 34px;
    text-align:center;border-top:1px solid var(--paper-line);
  }
  
  /* PDF Only styling adjustment */
  .pdf-header { display: none; margin-bottom: 20px; border-bottom: 2px solid #00FF66; padding-bottom: 10px; }

  @media(max-width:480px){
    .row{flex-direction:column;gap:4px;}
    .row .value{text-align:left;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">VC</div>
    <div>
      <div class="brand-name">VaahanCheck</div>
      <div class="brand-tag">RC &amp; RTO Lookup</div>
    </div>
  </div>
</div>

<section class="hero">
  <div class="hero-inner">
    <span class="eyebrow">Vehicle RC Lookup</span>
    <h1>Apni gaadi ki poori kundli,<br>ek search mein.</h1>
    
    <div class="plate-search">
      <div class="plate-strip"><span class="iso">IND</span></div>
      <div class="plate-input-wrap">
        <input type="text" id="vehicleInput" class="plate-input" placeholder="GJ14X4555" maxlength="13">
      </div>
      <button id="searchBtn" class="stamp-btn">
        <span>Search</span>
      </button>
    </div>

    <!-- PDF Download Button -->
    <button id="downloadPdfBtn" class="download-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save as PDF
    </button>
  </div>
</section>

<div class="results-wrap">
  <div class="state-panel" id="loadingPanel">
    <div class="spinner"></div>
    <p>RTO records khangaal rahe hain…</p>
  </div>

  <!-- Ye area PDF mein print hoga -->
  <div id="printableArea">
    <div class="pdf-header" id="pdfHeader">
        <h2 style="color:#00FF66; font-family:'Rajdhani'; margin:0;">VaahanCheck Report</h2>
        <p style="color:#888; font-size:12px; margin:5px 0;">Generated on: <span id="pdfDate"></span></p>
    </div>

    <div class="echo-plate" id="echoPlate">
      <div class="echo-number mono" id="echoNumber">—</div>
      <div class="echo-meta">
        <span class="name" id="echoName">—</span>
        <span class="sub" id="echoSub">—</span>
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>
</div>

<footer>
  <p style="font-size:12px; color:#555;">Data for reference only. © 2026 VaahanCheck</p>
</footer>

<script>
(function(){
  "use strict";

  var API_PREFIX = "https://vehicly-tau.vercel.app/details=";

  var SECTIONS = [
    { id:'owner', title:'Owner Details', stripClass:'strip-owner', fields:[
        { label:'Owner Name', keys:['ownerName','name','owner_name'] },
        { label:'City', keys:['cityName','city'] },
        { label:'Address', keys:['address','presentAddress'] }
    ]},
    { id:'vehicle', title:'Vehicle Details', stripClass:'strip-vehicle', fields:[
        { label:'Model', keys:['modelName','makerModel','modal_name'] },
        { label:'Class', keys:['vehicleClass','class'] },
        { label:'Fuel', keys:['fuelType'] },
        { label:'Engine No', keys:['engineNumber','engineNo'] },
        { label:'Chassis No', keys:['chassisNumber','chassisNo'] }
    ]},
    { id:'insurance', title:'Insurance & Compliance', stripClass:'strip-insurance', fields:[
        { label:'Insurance Upto', keys:['insuranceUpto','insuranceExpiry'] },
        { label:'Fitness Upto', keys:['fitnessUpto'] },
        { label:'PUC Upto', keys:['pucUpto'] }
    ]}
  ];

  var inputEl = document.getElementById('vehicleInput');
  var searchBtn = document.getElementById('searchBtn');
  var downloadBtn = document.getElementById('downloadPdfBtn');
  var cardsGrid = document.getElementById('cardsGrid');
  var loadingPanel = document.getElementById('loadingPanel');
  var echoPlate = document.getElementById('echoPlate');

  function flatten(obj, out){
    out = out || {};
    if(!obj || typeof obj !== 'object') return out;
    Object.keys(obj).forEach(function(k){
      if(obj[k] && typeof obj[k] === 'object' && !Array.isArray(obj[k])) flatten(obj[k], out);
      else out[k.toLowerCase().replace(/[^a-z0-9]/g,'')] = obj[k];
    });
    return out;
  }

  function pickValue(flat, keys){
    for(var i=0; i<keys.length; i++){
      var k = keys[i].toLowerCase().replace(/[^a-z0-9]/g,'');
      if(flat[k]) return String(flat[k]);
    }
    return null;
  }

  function renderResults(data, queried){
    var flat = flatten(data);
    var html = '';
    
    SECTIONS.forEach(function(sec){
      var rows = '';
      sec.fields.forEach(function(f){
        var val = pickValue(flat, f.keys);
        if(val) rows += '<div class="row"><span class="label">'+f.label+'</span><span class="value">'+val+'</span></div>';
      });
      if(rows) html += '<div class="card"><div class="card-strip '+sec.stripClass+'"></div><div class="card-head"><h3>'+sec.title+'</h3></div><div class="card-body">'+rows+'</div></div>';
    });

    loadingPanel.classList.remove('visible');
    if(!html){ alert("No data found"); return; }

    cardsGrid.innerHTML = html;
    cardsGrid.classList.add('visible');
    
    document.getElementById('echoNumber').textContent = queried;
    document.getElementById('echoName').textContent = pickValue(flat, ['ownerName']) || 'Owner Details Unavailable';
    document.getElementById('echoSub').textContent = pickValue(flat, ['modelName','makerModel']) || '';
    echoPlate.classList.add('visible');
    
    // Show PDF Button
    downloadBtn.classList.add('visible');
  }

  searchBtn.addEventListener('click', function(){
    var val = inputEl.value.trim().toUpperCase();
    if(!val) return;
    
    loadingPanel.classList.add('visible');
    cardsGrid.classList.remove('visible');
    echoPlate.classList.remove('visible');
    downloadBtn.classList.remove('visible');

    fetch(API_PREFIX + val)
      .then(res => res.json())
      .then(json => {
        var payload = json.data || json.result || json;
        renderResults(payload, val);
      })
      .catch(err => {
        loadingPanel.classList.remove('visible');
        alert("Error fetching data");
      });
  });

  // --- PDF DOWNLOAD LOGIC ---
  downloadBtn.addEventListener('click', function() {
    var element = document.getElementById('printableArea');
    var vehicleNo = document.getElementById('echoNumber').textContent;
    
    // PDF Header update
    document.getElementById('pdfDate').textContent = new Date().toLocaleString();
    document.getElementById('pdfHeader').style.display = 'block';

    var opt = {
      margin:       10,
      filename:     'RC_Report_' + vehicleNo + '.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, backgroundColor: '#050505', useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    downloadBtn.textContent = "Generating...";
    
    html2pdf().set(opt).from(element).save().then(() => {
      downloadBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save as PDF`;
      document.getElementById('pdfHeader').style.display = 'none';
    });
  });

})();
</script>
</body>
</html>
